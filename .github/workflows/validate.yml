name: AeroSim validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/aerosim-full-overhaul]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: npm run check
