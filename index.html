<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroSim Empire - 航空帝國</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    #map { height: 320px; width: 100%; border-radius: 0.75rem; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

  <!-- 頂部資訊列 -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-50 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="bg-blue-600 p-2 rounded-lg text-white font-bold tracking-wider text-sm">AS</div>
      <div>
        <h1 class="font-bold text-base leading-none">星空亞洲航空</h1>
        <span class="text-xs text-slate-400">Holding: Star Alliance Group</span>
      </div>
    </div>
    
    <div class="flex items-center space-x-4 text-sm">
      <div class="bg-slate-800/80 px-3 py-1.5 rounded-md border border-slate-700">
        <span class="text-xs text-slate-400 block">現金餘額</span>
        <span class="font-mono text-emerald-400 font-semibold">$10,000,000 <span class="text-xs text-slate-400">AS$</span></span>
      </div>
    </div>
  </header>

  <!-- 主內容分區 -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 space-y-6">

    <!-- 關鍵指標卡片 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl cursor-pointer hover:border-slate-700 transition" onclick="location.href='fleet.html'">
        <p class="text-xs text-slate-400">現役機隊 (點擊進入)</p>
        <p class="text-2xl font-bold font-mono text-slate-100 mt-1">12 <span class="text-xs text-slate-500 font-normal">架</span></p>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <p class="text-xs text-slate-400">營運航線 (Routes)</p>
        <p class="text-2xl font-bold font-mono text-slate-100 mt-1">28 <span class="text-xs text-slate-500 font-normal">條</span></p>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <p class="text-xs text-slate-400">平均載客率 (Load Factor)</p>
        <p class="text-2xl font-bold font-mono text-emerald-400 mt-1">84.2%</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <p class="text-xs text-slate-400">上週淨利潤 (Weekly P&L)</p>
        <p class="text-2xl font-bold font-mono text-emerald-400 mt-1">+$428,500</p>
      </div>
    </div>

    <!-- 航網地圖與操作 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <div class="lg:col-span-2 bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="font-semibold text-sm text-slate-200">全球營運航網地圖</h2>
          <span class="text-xs bg-blue-950 text-blue-400 px-2 py-0.5 rounded border border-blue-800">樞紐: TPE / HKG</span>
        </div>
        <div id="map"></div>
      </div>

      <!-- 快捷操作（已加入動作響應） -->
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-col justify-between space-y-4">
        <div>
          <h2 class="font-semibold text-sm text-slate-200 mb-3">總裁快速操作</h2>
          <div class="space-y-2">
            <button onclick="handleAction('開闢新航線')" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium py-2.5 px-4 rounded-lg flex items-center justify-between transition">
              <span>+ 開闢新航線</span>
              <i data-lucide="plane-takeoff" class="w-4 h-4"></i>
            </button>
            <button onclick="location.href='fleet.html'" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium py-2.5 px-4 rounded-lg flex items-center justify-between transition">
              <span>引進新飛機 (進入機隊)</span>
              <i data-lucide="plus-circle" class="w-4 h-4"></i>
            </button>
            <button onclick="location.href='fleet.html'" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium py-2.5 px-4 rounded-lg flex items-center justify-between transition">
              <span>調整客艙配置 & 票價</span>
              <i data-lucide="sliders" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div class="bg-slate-950 border border-slate-800 p-3 rounded-lg text-xs space-y-1">
          <p class="text-amber-400 font-medium">⚠️ 航務提醒</p>
          <p class="text-slate-400">飛機 B-16701 (B738) 即將抵達 A 級定期檢修保養週期。</p>
        </div>
      </div>

    </div>

  </main>

  <!-- 底部導覽列（已接通連結） -->
  <nav class="bg-slate-900 border-t border-slate-800 px-6 py-2 flex justify-around text-xs text-slate-400">
    <a href="index.html" class="flex flex-col items-center text-blue-400">
      <i data-lucide="layout-dashboard" class="w-5 h-5 mb-1"></i>
      <span>儀表板</span>
    </a>
    <a href="fleet.html" class="flex flex-col items-center hover:text-slate-200">
      <i data-lucide="plane" class="w-5 h-5 mb-1"></i>
      <span>機隊管理</span>
    </a>
    <a href="#" onclick="handleAction('航線網路')" class="flex flex-col items-center hover:text-slate-200">
      <i data-lucide="map-pin" class="w-5 h-5 mb-1"></i>
      <span>航線網路</span>
    </a>
    <a href="#" onclick="handleAction('財務損益')" class="flex flex-col items-center hover:text-slate-200">
      <i data-lucide="line-chart" class="w-5 h-5 mb-1"></i>
      <span>財務損益</span>
    </a>
  </nav>

  <script>
    lucide.createIcons();

    // 地圖初始化
    const map = L.map('map').setView([23.5, 121], 4);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 18 }).addTo(map);
    L.circleMarker([25.0777, 121.2330], { color: '#3b82f6', fillColor: '#60a5fa', fillOpacity: 0.8, radius: 7 }).addTo(map).bindPopup("<b>台北桃園 (TPE)</b>");

    // 按鈕點擊響應函式
    function handleAction(featureName) {
      alert(`【系統通知】${featureName} 功能模組開發中，即將推出！`);
    }
  </script>
</body>
</html>
