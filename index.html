<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroSim MMO - 專業航空帝國線上模擬聯機系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="css/airlinesim.css">
</head>
<body class="min-h-screen flex flex-col custom-scroll selection:bg-blue-900 selection:text-white">

  <!-- 1. 頂部狀態列 -->
  <header class="bg-[#1a202c] border-b border-[#2d3748] sticky top-0 z-50 text-xs">
    <div class="px-4 py-1.5 flex items-center justify-between border-b border-[#2d3748] bg-[#141923]">
      <div class="flex items-center space-x-4">
        <span class="font-black tracking-widest text-base text-white flex items-center space-x-1 cursor-pointer">
          <span class="bg-blue-700 text-white px-1.5 py-0.5 text-xs font-mono">AS</span>
          <span>AIRLINESIM</span>
        </span>
        <span class="text-gray-600">|</span>
        <span class="text-gray-300 font-bold">星空亞洲航空 (Yeddo Pacific)</span>
        <span id="header-cash" class="text-rose-400 font-mono font-bold">-166,669 AS$</span>
      </div>

      <div class="flex items-center space-x-4 font-mono text-[11px]">
        <div class="text-gray-300 flex items-center space-x-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>真實時間 (UTC): <strong id="real-utc-clock" class="text-amber-400">--</strong></span>
        </div>
      </div>
    </div>

    <!-- 2. 四大企業級二級導覽選單 -->
    <nav class="px-4 bg-[#1a202c] flex space-x-1 font-medium text-gray-200">
      <div class="dropdown relative py-1.5 px-3 hover:bg-[#2d3748] cursor-pointer">
        <span class="flex items-center space-x-1"><span>公司</span><i data-lucide="chevron-down" class="w-3 h-3 text-gray-400"></i></span>
        <div class="dropdown-menu absolute left-0 top-full hidden bg-[#1a202c] border border-[#2d3748] shadow-2xl min-w-[200px] py-1 text-xs font-normal">
          <a href="#" data-view-target="overview" class="block px-3 py-1.5 hover:bg-[#2b3649]">概覽 (Overview)</a>
          <a href="#" data-view-target="company-settings" class="block px-3 py-1.5 hover:bg-[#2b3649]">系統設定</a>
        </div>
      </div>

      <div class="dropdown relative py-1.5 px-3 hover:bg-[#2d3748] cursor-pointer">
        <span class="flex items-center space-x-1"><span>管理</span><i data-lucide="chevron-down" class="w-3 h-3 text-gray-400"></i></span>
        <div class="dropdown-menu absolute left-0 top-full hidden bg-[#1a202c] border border-[#2d3748] shadow-2xl min-w-[200px] py-1 text-xs font-normal">
          <a href="#" data-view-target="procurement" class="block px-3 py-1.5 hover:bg-[#2b3649]">採購與飛機市場</a>
          <a href="#" data-view-target="hr" class="block px-3 py-1.5 hover:bg-[#2b3649]">人力資源</a>
        </div>
      </div>

      <div class="dropdown relative py-1.5 px-3 hover:bg-[#2d3748] cursor-pointer">
        <span class="flex items-center space-x-1"><span>商業</span><i data-lucide="chevron-down" class="w-3 h-3 text-gray-400"></i></span>
        <div class="dropdown-menu absolute left-0 top-full hidden bg-[#1a202c] border border-[#2d3748] shadow-2xl min-w-[200px] py-1 text-xs font-normal">
          <a href="#" data-view-target="network" class="block px-3 py-1.5 hover:bg-[#2b3649]">航線網絡規劃</a>
          <a href="#" data-view-target="sales" class="block px-3 py-1.5 hover:bg-[#2b3649]">銷售與票價</a>
        </div>
      </div>

      <div class="dropdown relative py-1.5 px-3 hover:bg-[#2d3748] cursor-pointer">
        <span class="flex items-center space-x-1"><span>營運</span><i data-lucide="chevron-down" class="w-3 h-3 text-gray-400"></i></span>
        <div class="dropdown-menu absolute left-0 top-full hidden bg-[#1a202c] border border-[#2d3748] shadow-2xl min-w-[200px] py-1 text-xs font-normal">
          <a href="#" data-view-target="fleet" class="block px-3 py-1.5 hover:bg-[#2b3649]">機隊分派調度</a>
          <a href="#" data-view-target="occ" class="block px-3 py-1.5 hover:bg-[#2b3649]">即時 OCC 運行控制</a>
        </div>
      </div>
    </nav>
  </header>

  <!-- 3. 主內容容器 -->
  <main id="main-content" class="flex-1 max-w-[1700px] w-full mx-auto p-3 space-y-3">
    <div class="as-box p-3"><p class="text-xs text-gray-400">核心模組系統載入中...</p></div>
  </main>

  <script type="module">
    import { aircraftModels } from './src/data/aircrafts.js';
    import { checkScheduleConflict } from './src/engine/scheduler.js';

    lucide.createIcons();

    // 秒級 1:1 UTC 時鐘
    setInterval(() => {
      document.getElementById('real-utc-clock').innerText = new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
    }, 1000);
  </script>
</body>
</html>
